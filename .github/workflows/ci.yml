name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build client bundle
        run: npm run build

      - name: Check generated bundle is committed
        run: git diff --exit-code -- client.js

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Validate market index
        run: npm run validate:index

      - name: Check package contents
        run: npm pack --dry-run
